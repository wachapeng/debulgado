<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a2616">
  <meta name="description" content="Point of sale for Debulgado's Coffee Shop. Works offline.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Debulgado POS">
  <title>Debulgado's POS</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/poppins-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before anything draws, so dark mode never flashes white.
    try { var t = JSON.parse(localStorage.getItem('pos:prefs') || '{}').theme || 'auto';
      document.documentElement.dataset.theme = t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t; } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="print-area"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript>This app needs JavaScript turned on.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
