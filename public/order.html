<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3a2616">
  <meta name="description" content="Order from your phone, then pay at the counter.">
  <title>Order · Debulgado's Coffee Shop</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/poppins-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <script>
    // Follow the phone's light or dark setting.
    try { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) {}
  </script>
</head>
<body class="customer">
  <div id="app"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript>This page needs JavaScript turned on.</noscript>
  <script type="module" src="/js/order/main.js"></script>
</body>
</html>
